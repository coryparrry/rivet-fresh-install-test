            printf '%s\n' "$_GH_AW_CHROOT_JSON" > "${RUNNER_TEMP}/gh-aw/awf-config.json"
            printf '%s\n' "$_GH_AW_CHROOT_JSON" > "${RUNNER_TEMP}/gh-aw/awf-config.json"
          fi
          GH_AW_TOOL_CACHE_MOUNT=""
          GH_AW_TOOL_CACHE="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must be set}"
          if [ -d "$GH_AW_TOOL_CACHE" ]; then
            if [[ "$GH_AW_TOOL_CACHE" != /opt/* ]]; then
              GH_AW_TOOL_CACHE_MOUNT="$GH_AW_TOOL_CACHE:$GH_AW_TOOL_CACHE:ro"
            fi
          fi
          # shellcheck disable=SC1003,SC2016,SC2086
          awf --config "${RUNNER_TEMP}/gh-aw/awf-config.json" --container-workdir "${GITHUB_WORKSPACE}" --mount "${RUNNER_TEMP}/gh-aw:${RUNNER_TEMP}/gh-aw:ro" --mount "${RUNNER_TEMP}/gh-aw:/host${RUNNER_TEMP}/gh-aw:ro" ${GH_AW_TOOL_CACHE_MOUNT:+--mount "$GH_AW_TOOL_CACHE_MOUNT"} ${GH_AW_DOCKER_HOST:+--docker-host "$GH_AW_DOCKER_HOST"} --env-all --exclude-env ACTIONS_ID_TOKEN_REQUEST_TOKEN --exclude-env ACTIONS_ID_TOKEN_REQUEST_URL --exclude-env CODEX_API_KEY --exclude-env OPENAI_API_KEY --mount /tmp/gh-aw:/tmp/gh-aw:rw --log-level info --skip-pull \
            -- /bin/bash -c 'set +o histexpand; : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE must be set}"; GH_AW_TOOL_CACHE="$RUNNER_TOOL_CACHE"; export PATH="$(find "$GH_AW_TOOL_CACHE" -maxdepth 5 -type d -name bin 2>/dev/null | tr '\''\n'\'' '\'':'\'')$PATH"; [ -n "$GOROOT" ] && export PATH="$GOROOT/bin:$PATH" || true; [ -n "$ERLANG_HOME" ] && export PATH="$ERLANG_HOME/bin:$PATH" || true && GH_AW_NODE_EXEC="${GH_AW_NODE_BIN:-}"; if [ -z "$GH_AW_NODE_EXEC" ] || [ ! -x "$GH_AW_NODE_EXEC" ]; then GH_AW_NODE_EXEC="$(command -v node 2>/dev/null || true)"; fi; if [ -z "$GH_AW_NODE_EXEC" ]; then echo "node runtime missing on this runner — check runtimes.node in workflow YAML" >&2; exit 127; fi; GH_AW_NPM_GLOBAL_ROOT="$(npm root -g 2>/dev/null || true)"; if [ -n "$GH_AW_NPM_GLOBAL_ROOT" ]; then export NODE_PATH="${GH_AW_NPM_GLOBAL_ROOT}${NODE_PATH:+:${NODE_PATH}}"; fi; "$GH_AW_NODE_EXEC" ${RUNNER_TEMP}/gh-aw/actions/codex_harness.cjs codex exec${GH_AW_MODEL_DETECTION_CODEX:+ --model "$GH_AW_MODEL_DETECTION_CODEX"} -c web_search="disabled" -c fetch="disabled" --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check  --output-schema /tmp/gh-aw/threat-detection/detection_schema.json -o /tmp/gh-aw/threat-detection/detection_result.json --prompt-file /tmp/gh-aw/aw-prompts/prompt.txt' 2>&1 | tee -a /tmp/gh-aw/threat-detection/detection.log
        env:
          GITHUB_STEP_SUMMARY: /tmp/gh-aw/step-summary.md
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          CODEX_HOME: /tmp/gh-aw/mcp-config
          GH_AW_MAX_TURNS: ${{ vars.GH_AW_DEFAULT_MAX_TURNS || '' }}
          GH_AW_MCP_CONFIG: ${{ runner.temp }}/gh-aw/mcp-config/config.toml
          GH_AW_MODEL_DETECTION_CODEX: gpt-5.6-luna
          GH_AW_PHASE: detection
          GH_AW_PROMPT: /tmp/gh-aw/aw-prompts/prompt.txt
          GH_AW_VERSION: v0.86.2
          GITHUB_AW: true
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          OPENAI_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
          RUST_LOG: ${{ runner.debug == 1 && 'trace,hyper_util=info,mio=info,reqwest=info,os_info=info,codex_otel=warn,codex_core=debug,ocodex_exec=debug' || 'warn' }}
          TRACEPARENT: ${{ env.GITHUB_AW_OTEL_TRACE_ID != '' && env.GITHUB_AW_OTEL_PARENT_SPAN_ID != '' && format('00-{0}-{1}-01', env.GITHUB_AW_OTEL_TRACE_ID, env.GITHUB_AW_OTEL_PARENT_SPAN_ID) || '' }}
      - name: Echo detection step summary
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        run: |
          if [ -s /tmp/gh-aw/step-summary.md ]; then
            cat /tmp/gh-aw/step-summary.md
          fi
      - name: Render detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/render_detection_log.cjs');
            await main();
      - name: Parse threat detection token usage for step summary
        id: parse_detection_token_usage
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_TOKEN_USAGE_SUMMARY_TITLE: Threat Detection Token Usage
        with:
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_token_usage.cjs');
            await main();
      - name: Upload threat detection log
        if: always() && steps.detection_guard.outputs.run_detection == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detection
          path: /tmp/gh-aw/threat-detection/detection.log
          if-no-files-found: ignore
      - name: Parse and conclude threat detection
        id: detection_conclusion
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_DETECTION: ${{ steps.detection_guard.outputs.run_detection }}
          DETECTION_AGENTIC_EXECUTION_OUTCOME: ${{ steps.detection_agentic_execution.outcome }}
          GH_AW_DETECTION_CONTINUE_ON_ERROR: "true"
        with:
          script: |
            try {
              const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
              setupGlobals(core, github, context, exec, io, getOctokit);
              const { main } = require('${{ runner.temp }}/gh-aw/actions/parse_threat_detection_results.cjs');
              await main();
            } catch (loadErr) {
              const continueOnError = process.env.GH_AW_DETECTION_CONTINUE_ON_ERROR !== 'false';
              const detectionExecutionFailed = process.env.DETECTION_AGENTIC_EXECUTION_OUTCOME === 'failure';
              const msg = 'ERR_SYSTEM: \u274C Unexpected error loading threat detection module: ' + (loadErr && loadErr.message ? loadErr.message : String(loadErr));
              core.error(msg);
              core.setOutput('reason', 'parse_error');
              if (continueOnError && !detectionExecutionFailed) {
                core.warning('\u26A0\uFE0F ' + msg);
                core.setOutput('conclusion', 'warning');
                core.setOutput('success', 'false');
              } else {
                core.setOutput('conclusion', 'failure');
                core.setOutput('success', 'false');
                core.setFailed(msg);
              }
            }

  pre_activation:
    needs: review_context
    runs-on: ubuntu-slim
    env:
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      activated: ${{ steps.check_membership.outputs.is_team_member == 'true' }}
      matched_command: ''
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # 6aab9e5b5c91c615506061f09bedd81a23babe3c
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Rivet pull request review"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/rivet-review.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.147.0"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "codex"
      - name: Check team membership for workflow
        id: check_membership
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_REQUIRED_ROLES: "admin,maintainer,write"
          GH_AW_ALLOWED_BOTS: "${{ vars.RIVET_APP_BOT_LOGIN }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/check_membership.cjs');
            await main();

  publish_review_tags:
    needs:
      - agent
      - detection
      - safe_outputs
    if: >
      (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'publish_review_tags') &&
      (always())
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
          RIVET_SAFE_OUTPUTS_RESULT: ${{ needs.safe_outputs.result }}
        with:
          app-id: ${{ vars.RIVET_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: write
          private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
          RIVET_SAFE_OUTPUTS_RESULT: ${{ needs.safe_outputs.result }}
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const fs = require("fs");
            let output;
            try {
              output = JSON.parse(
                fs.readFileSync(process.env.GH_AW_AGENT_OUTPUT, "utf8"),
              );
            } catch {
              output = { items: [], errors: ["agent output unavailable"] };
            }
            const item = output.items?.filter(
              (candidate) => candidate?.type === "publish_review_tags",
            );
            const review = output.items?.filter(
              (candidate) => candidate?.type === "submit_pull_request_review",
            );
            const invalid = () => {
              throw new Error("Rivet review: invalid bound tag output");
            };
            const wellFormed =
              process.env.RIVET_SAFE_OUTPUTS_RESULT === "success" &&
              Array.isArray(item) &&
              item.length === 1 &&
              Array.isArray(review) &&
              review.length === 1 &&
              typeof review[0].body === "string" &&
              output.errors?.length === 0 &&
              JSON.stringify(Object.keys(item[0]).sort()) ===
                JSON.stringify(["missing_test", "recommendation", "type"]) &&
              ["block", "manual", "auto"].includes(item[0].recommendation) &&
              ["true", "false"].includes(item[0].missing_test);
            const reviewStatuses = {
              block: "⛔ **Changes needed before merge**",
              manual: "⚠️ **Ready for maintainer review**",
              auto: "✅ **Ready to merge**",
            };
            const publishable =
              wellFormed &&
              Object.values(reviewStatuses).filter((status) => review[0].body.includes(status))
                .length === 1 &&
              review[0].body.includes(reviewStatuses[item[0].recommendation]);
            const eventPull = context.payload.pull_request;
            if (
              context.eventName !== "pull_request_target" ||
              !["opened", "synchronize", "reopened", "ready_for_review"].includes(
                context.payload.action,
              ) ||
              !Number.isSafeInteger(eventPull?.number) ||
              eventPull.number < 1
            ) invalid();
            const { data: livePull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPull.number,
            });
            const current = (pull) =>
              pull?.id === eventPull.id &&
              pull.number === eventPull.number &&
              pull.state === "open" &&
              pull.base?.sha === eventPull.base?.sha &&
              pull.head?.sha === eventPull.head?.sha;
            const loadCurrent = async () => {
              const pull = (
                await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: eventPull.number,
                })
              ).data;
              if (!current(pull)) invalid();
              return pull;
            };
            if (!current(livePull)) invalid();
            const definitions = {
              "changes required": ["B60205", "Verified changes are required before merge"],
              "review needed": ["FBCA04", "Human review or judgment is required"],
              "merge ready": ["0E8A16", "Meets the configured merge policy"],
              "needs tests": ["D4C5F9", "Deterministic test coverage is missing"],
            };
            const status = {
              block: "changes required",
              manual: "review needed",
              auto: "merge ready",
            }[publishable ? item[0].recommendation : "manual"];
            const desired = new Set([
              status,
              ...(publishable && item[0].missing_test === "true" ? ["needs tests"] : []),
            ]);
            for (const name of desired) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name,
                    color: definitions[name][0],
                    description: definitions[name][1],
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ ...context.repo, name });
                }
              }
            }
            const mutationPull = await loadCurrent();
            const existing = new Set(
              (mutationPull.labels ?? [])
                .map((label) => (typeof label === "string" ? label : label?.name))
                .filter(Boolean),
            );
            for (const name of Object.keys(definitions)) {
              if (!existing.has(name) || desired.has(name)) continue;
              await loadCurrent();
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: livePull.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const additions = [...desired].filter((name) => !existing.has(name));
            if (additions.length > 0) {
              await loadCurrent();
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: livePull.number,
                labels: additions,
              });
            }
            const finalPull = await loadCurrent();
            const finalManaged = (finalPull.labels ?? [])
              .map((label) => (typeof label === "string" ? label : label?.name))
              .filter((name) => Object.hasOwn(definitions, name))
              .sort();
            if (JSON.stringify(finalManaged) !== JSON.stringify([...desired].sort())) invalid();
            if (!publishable && process.env.RIVET_SAFE_OUTPUTS_RESULT === "success") invalid();

  review_context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/rivet/actions/authority-receipt
            .github/rivet/actions/prepare-review-context
      - name: Record Rivet authority receipt
        id: rivet-authority
        uses: ./.github/rivet/actions/authority-receipt
        with:
          compiler-version: v0.86.2
          workflow-id: rivet-review
          workflow-ref: ${{ github.workflow_ref }}
          workflow-sha: ${{ github.workflow_sha }}
      - id: snapshot
        uses: ./.github/rivet/actions/prepare-review-context
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

  review_tags_pending:
    needs: pre_activation
    if: needs.pre_activation.outputs.activated == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RIVET_APP_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: write
          private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const eventPull = context.payload.pull_request;
            const invalid = () => {
              throw new Error("Rivet review: invalid pending tag target");
            };
            if (
              context.eventName !== "pull_request_target" ||
              !["opened", "synchronize", "reopened", "ready_for_review"].includes(
                context.payload.action,
              ) ||
              !Number.isSafeInteger(eventPull?.number) ||
              eventPull.number < 1
            ) invalid();
            const current = (pull) =>
              pull?.id === eventPull.id &&
              pull.number === eventPull.number &&
              pull.state === "open" &&
              pull.base?.sha === eventPull.base?.sha &&
              pull.head?.sha === eventPull.head?.sha;
            const loadCurrent = async () => {
              const pull = (
                await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: eventPull.number,
                })
              ).data;
              if (!current(pull)) invalid();
              return pull;
            };
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: "review needed" });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: "review needed",
                  color: "FBCA04",
                  description: "Human review or judgment is required",
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }
            const managed = new Set([
              "changes required",
              "review needed",
              "merge ready",
              "needs tests",
            ]);
            const pull = await loadCurrent();
            const existing = new Set(
              (pull.labels ?? [])
                .map((label) => (typeof label === "string" ? label : label?.name))
                .filter(Boolean),
            );
            for (const name of managed) {
              if (!existing.has(name) || name === "review needed") continue;
              await loadCurrent();
              try {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: eventPull.number,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!existing.has("review needed")) {
              await loadCurrent();
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: eventPull.number,
                labels: ["review needed"],
              });
            }
            // ponytail: GitHub labels have no head-SHA CAS; per-PR concurrency plus the
            // next event's pending reset bounds the unavoidable write race.
            const finalPull = await loadCurrent();
            const finalManaged = (finalPull.labels ?? [])
              .map((label) => (typeof label === "string" ? label : label?.name))
              .filter((name) => managed.has(name))
              .sort();
            if (JSON.stringify(finalManaged) !== JSON.stringify(["review needed"])) invalid();

  safe_outputs:
    needs:
      - activation
      - agent
      - detection
    if: >
      ((!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success') &&
      (needs.agent.result == 'success')
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/rivet-review"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "codex"
      GH_AW_ENGINE_MODEL: "gpt-5.6-luna"
      GH_AW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "rivet-review"
      GH_AW_WORKFLOW_NAME: "Rivet pull request review"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/rivet-review.md"
    outputs:
      app_token_minting_failed: ${{ steps.safe-outputs-app-token.outcome == 'failure' }}
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      created_issue_number: ${{ steps.process_safe_outputs.outputs.created_issue_number }}
      created_issue_url: ${{ steps.process_safe_outputs.outputs.created_issue_url }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@6aab9e5b5c91c615506061f09bedd81a23babe3c # 6aab9e5b5c91c615506061f09bedd81a23babe3c
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Rivet pull request review"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/rivet-review.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "0.147.0"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
          GH_AW_INFO_ENGINE_ID: "codex"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub App token
        id: safe-outputs-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RIVET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RIVET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          github-api-url: ${{ github.api_url }}
          permission-issues: write
          permission-pull-requests: write
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "172.30.0.1,api.github.com,api.openai.com,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,chatgpt.com,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,github.com,host.docker.internal,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,openai.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,ppa.launchpad.net,s.symcb.com,s.symcd.com,security.ubuntu.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUT_JOBS: "{\"publish_review_tags\":\"\"}"
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"create_issue\":{\"deduplicate_by_title\":true,\"max\":1,\"title_prefix\":\"[rivet] \"},\"create_pull_request_review_comment\":{\"max\":8,\"side\":\"RIGHT\"},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"report_incomplete\":{},\"submit_pull_request_review\":{\"allowed_events\":[\"COMMENT\"],\"max\":1}}"
        with:
          github-token: ${{ steps.safe-outputs-app-token.outputs.token }}
          script: |
            const { setupGlobals } = require('${{ runner.temp }}/gh-aw/actions/setup_globals.cjs');
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require('${{ runner.temp }}/gh-aw/actions/process_safe_outputs.cjs');
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
          if-no-files-found: ignore
